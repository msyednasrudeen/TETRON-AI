<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="TETRON AI - Intelligent AI Assistant"
    >

    <title>TETRON AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- =================================================
         APP
         ================================================= -->

    <div class="app">

        <!-- =================================================
             SIDEBAR
             ================================================= -->

        <aside
            class="sidebar"
            id="sidebar"
        >

            <div class="sidebar-header">

                <div class="brand">

                    <img
                        src="logo.png"
                        alt="TETRON AI"
                        class="brand-logo"
                    >

                    <div>
                        <h1>TETRON</h1>
                        <span>AI ASSISTANT</span>
                    </div>

                </div>

                <button
                    class="icon-btn"
                    id="closeSidebar"
                    type="button"
                    aria-label="Close sidebar"
                >
                    ×
                </button>

            </div>


            <!-- NEW CHAT -->

            <button
                class="new-chat-btn"
                id="newChat"
                type="button"
            >
                <span>＋</span>
                <span>New Chat</span>
            </button>


            <!-- MODE -->

            <div class="sidebar-section">

                <div class="section-title">
                    AI MODE
                </div>

                <button
                    class="mode-btn active"
                    data-mode="general"
                    type="button"
                >
                    <span>◉</span>
                    <span>General</span>
                </button>

                <button
                    class="mode-btn"
                    data-mode="ideas"
                    type="button"
                >
                    <span>✦</span>
                    <span>Ideas</span>
                </button>

                <button
                    class="mode-btn"
                    data-mode="study"
                    type="button"
                >
                    <span>▣</span>
                    <span>Study</span>
                </button>

                <button
                    class="mode-btn"
                    data-mode="coding"
                    type="button"
                >
                    <span>&lt;/&gt;</span>
                    <span>Coding</span>
                </button>

                <button
                    class="mode-btn"
                    data-mode="creative"
                    type="button"
                >
                    <span>✧</span>
                    <span>Creative</span>
                </button>

            </div>


            <!-- CHAT HISTORY -->

            <div class="sidebar-section history-section">

                <div class="section-title">
                    CHAT HISTORY
                </div>

                <div
                    id="chatHistory"
                    class="chat-history"
                ></div>

            </div>


            <div class="sidebar-footer">

                <span>TETRON AI</span>
                <span>v1.0</span>

            </div>

        </aside>


        <!-- =================================================
             OVERLAY
             ================================================= -->

        <div
            class="overlay"
            id="overlay"
        ></div>


        <!-- =================================================
             MAIN
             ================================================= -->

        <main class="main">

            <!-- TOP BAR -->

            <header class="topbar">

                <button
                    class="menu-btn"
                    id="menuBtn"
                    type="button"
                    aria-label="Open menu"
                >
                    ☰
                </button>

                <div class="topbar-title">

                    <span class="status-dot"></span>

                    <span>TETRON AI</span>

                </div>

                <div class="topbar-status">
                    ONLINE
                </div>

            </header>


            <!-- =================================================
                 CHAT AREA
                 ================================================= -->

            <section
                class="chat-area"
                id="messages"
            >

                <!-- WELCOME -->

                <div
                    class="welcome"
                    id="welcome"
                >

                    <div class="welcome-logo">

                        <img
                            src="logo.png"
                            alt="TETRON"
                        >

                    </div>

                    <h2>
                        Welcome to TETRON AI
                    </h2>

                    <p>
                        Your intelligent AI assistant.
                    </p>

                    <div class="welcome-line"></div>

                    <div class="suggestions">

                        <button
                            class="suggestion"
                            type="button"
                            data-prompt="Explain something interesting to me."
                        >
                            Explain something interesting
                        </button>

                        <button
                            class="suggestion"
                            type="button"
                            data-prompt="Give me a creative project idea."
                        >
                            Give me a project idea
                        </button>

                        <button
                            class="suggestion"
                            type="button"
                            data-prompt="Help me learn a programming concept."
                        >
                            Help me learn coding
                        </button>

                    </div>

                </div>

            </section>


            <!-- =================================================
                 INPUT AREA
                 ================================================= -->

            <div class="input-container">

                <div class="input-box">

                    <button
                        class="input-btn"
                        type="button"
                        id="attachBtn"
                        title="Attach"
                        aria-label="Attach"
                    >
                        ＋
                    </button>

                    <textarea
                        id="messageInput"
                        rows="1"
                        placeholder="Message TETRON..."
                        autocomplete="off"
                    ></textarea>

                    <button
                        class="input-btn"
                        type="button"
                        id="voiceBtn"
                        title="Voice"
                        aria-label="Voice"
                    >
                        🎙
                    </button>

                    <button
                        class="send-btn"
                        id="sendBtn"
                        type="button"
                        title="Send"
                        aria-label="Send message"
                    >
                        ↑
                    </button>

                </div>

                <div class="input-note">
                    TETRON AI can make mistakes. Verify important information.
                </div>

            </div>

        </main>

    </div>


    <!-- =================================================
         SCRIPT
         ================================================= -->

    <script src="script.js"></script>

</body>

</html>
